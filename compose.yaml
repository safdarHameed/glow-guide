name: glowguide

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: glowguide
      POSTGRES_USER: glowguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py first}
      GLOWGUIDE_TEST_DB_USER: glowguide_test
      GLOWGUIDE_TEST_DB_PASSWORD: ${GLOWGUIDE_TEST_DB_PASSWORD:?Run python scripts/setup_local.py first}
    ports:
      - "127.0.0.1:${GLOWGUIDE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
